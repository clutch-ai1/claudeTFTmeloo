name: Daten aktualisieren

# GitHub startet geplante Läufe ("schedule") oft stundenlang verspätet oder gar nicht.
# Deshalb läuft hier ein Dauer-Job: Er aktualisiert alle 30 Minuten, läuft gut 5 Stunden
# und startet sich am Ende selbst neu. Der Zeitplan alle 6 Stunden ist nur die Sicherung,
# falls die Kette einmal abreißt. Bei Änderungen an der Seite (build/, sheets/) gibt es
# zusätzlich sofort einen einzelnen Lauf.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dauer:
        description: "Dauer-Modus (alle 30 Minuten, startet sich selbst neu)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "sheets/**"
      - "build/**"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: ${{ github.event_name == 'push' && 'update-einmal' || 'update-dauer' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install pillow numpy
      - name: Aktualisieren
        env:
          SHEETS: sheets
          DOCS: docs
          DAUER: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dauer) }}
        run: |
          git config user.name "tft-planer-bot"
          git config user.email "actions@users.noreply.github.com"
          runden=1
          if [ "$DAUER" = "true" ]; then runden=10; fi
          for i in $(seq 1 $runden); do
            echo "=== Runde $i von $runden: $(date -u +'%H:%M') UTC ==="
            git pull --rebase -q origin main || true
            if python build/update.py work build/template.html docs/index.html data/history.json | tail -n 3 \
               && [ "$(stat -c%s docs/index.html)" -gt 100000 ]; then
              git add docs data
              if git diff --cached --quiet; then
                echo "Keine Änderungen"
              else
                git commit -q -m "Daten aktualisiert $(date -u +'%Y-%m-%d %H:%M') UTC"
                git push -q || (git pull --rebase -q origin main && git push -q) || echo "Push fehlgeschlagen, nächste Runde"
              fi
            else
              echo "Update fehlgeschlagen (MetaTFT nicht erreichbar?), nächste Runde"
              git checkout -- docs data 2>/dev/null || true
            fi
            if [ "$i" -lt "$runden" ]; then sleep 1800; fi
          done
      - name: Nächsten Dauer-Lauf starten
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dauer)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml -R "${{ github.repository }}" -f dauer=true
